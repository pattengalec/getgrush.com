<!DOCTYPE html>
<html lang="en" data-grush-site="hub">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Grush — Admin</title>
<link rel="stylesheet" href="grush-brand.css">
<style>
/* ── this page's own rules. grush-brand.css supplies tokens only,
   deliberately — component styling is each deployment's job. ── */

*{box-sizing:border-box;}
body{
  margin:0; min-height:100vh; background:var(--substrate); color:var(--mycelium);
  font-family:var(--body); font-size:15px; line-height:1.55;
  display:flex; flex-direction:column;
}

/* ═══ auth wall ═══ */
.auth-wall{
  flex:1; display:flex; align-items:center; justify-content:center;
  padding:24px;
}
.auth-card{
  width:100%; max-width:360px; text-align:center;
  background:var(--substrate-lift); border:1px solid var(--hairline);
  border-radius:16px; padding:32px 28px;
}
.auth-card .kick{
  font-family:var(--mono); font-size:var(--label-size); letter-spacing:var(--label-track);
  text-transform:uppercase; color:var(--mycelium-dim); margin:0 0 6px;
}
.auth-card h1{
  font-family:var(--display); font-weight:600; font-size:22px; margin:0 0 22px;
}
.field{text-align:left; margin-bottom:14px;}
.field label{
  display:block; font-family:var(--mono); font-size:11px; letter-spacing:.06em;
  text-transform:uppercase; color:var(--mycelium-dim); margin-bottom:6px;
}
.field input{
  width:100%; padding:12px 13px; border-radius:10px;
  border:1px solid var(--hairline); background:var(--substrate);
  color:var(--mycelium); font-family:var(--body); font-size:15px;
}
.field input:focus{outline:2px solid var(--steel-lit); outline-offset:1px;}
.btn{
  width:100%; padding:13px; border-radius:10px; border:none;
  background:var(--spore); color:var(--substrate); font-family:var(--body);
  font-weight:600; font-size:14px; cursor:pointer;
}
.btn:disabled{opacity:.5; cursor:default;}
#auth-msg{
  margin-top:12px; font-size:12.5px; color:var(--mycelium-dim); min-height:1.3em;
}
.auth-card .back{
  display:block; margin-top:20px; font-family:var(--mono); font-size:11px;
  color:var(--mycelium-faint); text-decoration:none;
}

/* ═══ main UI ═══ */
#main-ui{display:none; flex:1; flex-direction:column;}
header{
  padding:28px 20px 20px; border-bottom:1px solid var(--hairline);
  display:flex; align-items:center; justify-content:space-between; gap:16px;
}
header .kick{
  font-family:var(--mono); font-size:var(--label-size); letter-spacing:var(--label-track);
  text-transform:uppercase; color:var(--mycelium-dim); margin:0 0 4px;
}
header h1{font-family:var(--display); font-weight:600; font-size:24px; margin:0;}
.who{font-family:var(--mono); font-size:11px; color:var(--mycelium-faint); text-align:right;}
.who button{
  display:block; margin-top:6px; background:none; border:none; color:var(--steel-lit);
  font-family:var(--mono); font-size:11px; cursor:pointer; padding:0;
}

.deployments{
  padding:20px; display:grid; gap:14px; max-width:640px; margin:0 auto; width:100%;
  grid-template-columns:1fr;
}
@media(min-width:640px){ .deployments{grid-template-columns:1fr 1fr;} }

.dcard{
  background:var(--substrate-lift); border:1px solid var(--hairline);
  border-radius:14px; padding:18px 18px 16px;
}
.dcard .name{font-family:var(--display); font-weight:600; font-size:17px; margin:0 0 2px;}
.dcard .repo{
  font-family:var(--mono); font-size:11px; color:var(--mycelium-faint); margin:0 0 14px;
}
.dcard .links{display:flex; flex-direction:column; gap:2px;}
.dcard a{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding:9px 4px; border-radius:8px; text-decoration:none;
  color:var(--mycelium); font-size:13.5px; border-bottom:1px solid var(--hairline);
}
.dcard a:last-child{border-bottom:none;}
.dcard a:active{background:var(--steel-ground);}
.dcard a .arrow{color:var(--steel-lit); font-family:var(--mono); font-size:12px;}
.dcard a.muted{color:var(--mycelium-faint);}
.dcard .none{
  padding:9px 4px; font-size:13px; color:var(--mycelium-faint); font-style:italic;
}

footer{
  padding:20px; text-align:center; font-family:var(--mono); font-size:10.5px;
  color:var(--mycelium-faint);
}
</style>
</head>
<body>

<!-- ═══ AUTH WALL ═══ -->
<div class="auth-wall" id="auth-wall">
  <div class="auth-card">
    <p class="kick">Grush · Admin</p>

    <div id="auth-checking">
      <h1>Checking sign-in…</h1>
    </div>

    <div id="auth-form" style="display:none;">
      <h1>Operator sign-in</h1>
      <div class="field">
        <label>Email address</label>
        <input type="email" id="auth-email" placeholder="you@example.com"
               autocomplete="email" inputmode="email" autocapitalize="off" spellcheck="false">
      </div>
      <button class="btn" id="auth-send" onclick="sendAuthLink()">Email me a sign-in link</button>
      <p id="auth-msg"></p>
    </div>

    <a class="back" href="/">← getgrush.com</a>
  </div>
</div>

<!-- ═══ MAIN UI ═══ -->
<div id="main-ui">
  <header>
    <div>
      <p class="kick">Grush · Admin</p>
      <h1>Deployments</h1>
    </div>
    <div class="who">
      <span id="who-email"></span>
      <button onclick="signOut()">Sign out</button>
    </div>
  </header>

  <div class="deployments" id="deployments"></div>

  <footer>Links only — signing into GitHub is still required for anything here to open.</footer>
</div>

<!-- Identity stack. Order is load-bearing: supabase-js defines window.supabase,
     the anon key is set inline below (public by design), grush-auth.js reads both. -->
<script>window.SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdibGl6dWtubnZndXh5eGZlcXVoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM2MzE5NjIsImV4cCI6MjA5OTIwNzk2Mn0.9m3e5T4S1kL9wusD0ZJBgIkshGt_Ws55iEcBE8bbLiE';</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="grush-auth.js"></script>

<script>
/* One array owns every changeable value on this page — same convention
   as bfc-config.js. Add a deployment, add an entry; nothing else changes. */
const DEPLOYMENTS = [
  {
    name: 'Lancer Farms',
    repo: 'lancerfarms-v2',
    live: 'https://lancerfarms.com',
  },
  {
    name: 'Desert Fog Mycology',
    repo: 'DesertFog-Mycology',
    live: 'https://www.funguyfungi.org',
  },
  {
    name: 'GC-DPS / Cottages',
    repo: 'Cottages',
    live: null, // patent + design archive — no public site
  },
  {
    name: 'Grush Hub',
    repo: 'getgrush.com',
    live: 'https://getgrush.com',
  },
];

function renderDeployments() {
  const root = document.getElementById('deployments');
  root.innerHTML = DEPLOYMENTS.map(d => `
    <div class="dcard">
      <p class="name">${d.name}</p>
      <p class="repo">pattengalec/${d.repo}</p>
      <div class="links">
        <a href="https://github.com/pattengalec/${d.repo}" target="_blank" rel="noopener">
          Repository <span class="arrow">↗</span>
        </a>
        <a href="https://github.com/pattengalec/${d.repo}/settings" target="_blank" rel="noopener">
          Settings <span class="arrow">↗</span>
        </a>
        <a href="https://github.com/pattengalec/${d.repo}/settings/pages" target="_blank" rel="noopener">
          Pages / domain <span class="arrow">↗</span>
        </a>
        ${d.live
          ? `<a href="${d.live}" target="_blank" rel="noopener">Live site <span class="arrow">↗</span></a>`
          : `<div class="none">No public site</div>`}
      </div>
    </div>
  `).join('');
}

function authMsg(text) {
  const el = document.getElementById('auth-msg');
  if (el) el.textContent = text || '';
}

function showAuthForm(why) {
  document.getElementById('auth-checking').style.display = 'none';
  document.getElementById('auth-form').style.display = '';
  document.getElementById('auth-wall').style.display = 'flex';
  document.getElementById('main-ui').style.display = 'none';
  authMsg(why);
}

window.sendAuthLink = async function() {
  const email = document.getElementById('auth-email').value.trim();
  if (!email) { authMsg('Enter your email address.'); return; }
  const btn = document.getElementById('auth-send');
  btn.disabled = true;
  authMsg('Sending…');
  const { ok, msg } = await GRUSH.sendLink(email);
  authMsg(msg);
  if (!ok) btn.disabled = false;
};

window.signOut = async function() {
  await GRUSH.signOut();
  location.replace(location.pathname); // drop any #access_token fragment
};

async function gate() {
  const allowed = await GRUSH.requireOperator({
    onDenied: (why) => showAuthForm(
      why || 'Enter your email and we\'ll send you a one-time sign-in link.')
  });
  if (!allowed) return;

  const s = await GRUSH.session();
  document.getElementById('who-email').textContent = s?.user?.email || '';
  document.getElementById('auth-wall').style.display = 'none';
  document.getElementById('main-ui').style.display = 'flex';
  renderDeployments();
}

gate();
</script>
</body>
</html>
